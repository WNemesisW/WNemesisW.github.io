  gap: 6px 18px; font-size: 11.5px; color: var(--muted); pointer-events: none; }

.legend .bar::after { content: ""; position: absolute; right: -3px; top: -4px; border: 5px solid transparent; border-left: 8px solid var(--c4); border-right: 0; }

<script>
const NODES = [{"id": "info", "s": "3.1.1", "pg": 32, "p": 4, "imp": {"johtaminen": 2, "eu": 2, "puolustus": 1, "sisainen": 2, "talous": 2, "vaesto": 2, "henkinen": 2}, "fp": 36, "d": {"fi": "Vieras valtio tai muu toimija levittää tunteisiin vetoavia ja vastakkainasettelua lietsovia viestejä esimerkiksi valeuutissivustoilla, bottiverkostoilla ja sosiaalisessa mediassa, vaikkapa vaalien alla. Tavoitteena on horjuttaa luottamusta ja saada ihmiset ja päättäjät toimimaan omaa etuaan vastaan, ja kriisissä viranomaisten on vaikeampi saada viestinsä perille.", "en": "A foreign state or other actor spreads emotive, divisive messages through channels such as fake news sites, bot networks and social media, for example ahead of elections. The aim is to undermine trust and get people and decision-makers to act against their own interests, and in a crisis it becomes harder for the authorities to get their messages across.", "sv": "En främmande stat eller någon annan aktör sprider känsloladdade budskap som underblåser motsättningar via bland annat falska nyhetssajter, bottnätverk och sociala medier, till exempel inför val. Målet är att undergräva förtroendet och få människor och beslutsfattare att handla mot sina egna intressen, och i en kris blir det svårare för myndigheterna att nå fram med sina budskap."}, "h72": {"fi": "https://72tuntia.fi/viestinta-hairiotilanteissa-ja-oikea-tieto/", "en": "https://72tuntia.fi/en/communication-in-a-disruption-and-reliable-information/", "sv": "https://72tuntia.fi/sv/kommunikation-i-handelse-av-storningar-och-korrekt-information/", "t": {"fi": "Viestintä häiriötilanteissa ja oikea tieto", "en": "Communication in a disruption and reliable information", "sv": "Kommunikation i händelse av störningar och korrekt information"}}, "vj": null, "icon": "\u003cpath d=\"m3 11 18-5v12L3 14v-3z\"/>\u003cpath d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/>", "sh": [], "o": 6, "i": 6, "to": ["polit", "maahan", "vakiv", "terror", "sota", "pandemia"], "fr": ["polit", "maahan", "vakiv", "sateily", "viesti", "vesi"], "l": {"fi": "Informaatio­vaikuttaminen", "en": "Information influence", "sv": "Informations­påverkan"}, "n": {"fi": "Informaatiovaikuttaminen", "en": "Information influence", "sv": "Informationspåverkan"}, "all": {"fi": "Voi syventää kaikkien kriisien vaikutuksia (PDF-s. 36)", "en": "Can deepen the effects of all crises (PDF p. 36)", "sv": "Kan fördjupa effekterna av alla kriser (PDF s. 36)"}, "ky": {"fi": "Kyberliitos: nimetty. Toteutumistapoihin kuuluu murtautuminen ehdokkaiden sähköpostiin; kybertiedustelulla hankitun sisällön käyttö lisääntyy.", "en": "Cyber link: named. Ways the risk materializes include hacking into candidates' email; use of content obtained through cyber intelligence is increasing.", "sv": "Cyberkoppling: nämnd. Risken kan förverkligas bland annat genom intrång i kandidaters e-post; användningen av innehåll som inhämtats genom cyberunderrättelseverksamhet ökar."}}, {"id": "polit", "s": "3.1.2", "pg": 36, "p": 4, "imp": {"johtaminen": 2, "eu": 2, "puolustus": 2, "sisainen": 1, "talous": 3, "vaesto": 1, "henkinen": 2}, "fp": 41, "d": {"fi": "Vieras valtio pyrkii saamaan Suomen päättäjät ja yritykset toimimaan sen etujen mukaan esimerkiksi rahoituksella, yritysostoilla, taloudellisilla riippuvuuksilla tai vuotamalla varastettuja tietoja. Luottamus viranomaisiin, eduskuntaan ja tuomioistuimiin rapautuu, osaamista ja teknologiaa siirtyy ulkomaille, ja päättäjät voivat huomaamattaan alkaa ajaa painostajan asiaa.", "en": "A foreign state seeks to make Finnish decision-makers and companies act in its interests, for example through funding, company acquisitions, economic dependencies or leaks of stolen information. Trust in the authorities, Parliament and the courts erodes, know-how and technology move abroad, and decision-makers may unwittingly start to serve the pressuring state's agenda.", "sv": "En främmande stat utövar politiska och ekonomiska påtryckningar för att få finländska beslutsfattare och företag att agera i dess intresse, till exempel genom finansiering, företagsförvärv, ekonomiska beroenden eller läckor av stulen information. Förtroendet för myndigheterna, riksdagen och domstolarna urholkas, kunnande och teknik förs ut ur landet och beslutsfattare kan omedvetet börja gå den påtryckande statens ärenden."}, "h72": null, "vj": null, "icon": "\u003cline x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"/>\u003cline x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"/>\u003cline x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"/>\u003cline x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"/>\u003cline x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"/>\u003cpolygon points=\"12 2 20 7 4 7\"/>", "sh": [], "o": 12, "i": 6, "to": ["info", "sota", "avaruus", "viesti", "tieto", "sahko", "liikenne", "ruoka", "ketjut", "poltto", "jtalous", "rahoitus"], "fr": ["info", "maahan", "vakiv", "terror", "sota", "elain"], "l": {"fi": "Poliittinen ja taloudellinen painostus", "en": "Political and economic pressure", "sv": "Politiska och ekonomiska påtryckningar"}, "n": {"fi": "Poliittinen ja taloudellinen vaikuttaminen ja painostus", "en": "Political and economic influence and pressure", "sv": "Politisk och ekonomisk påverkan och påtryckning"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Venäjä häpäisee kohteita kyber- ja informaatiovaikuttamisen välimaaston operaatioilla vuotamalla laittomasti hankittuja tietoja.", "en": "Cyber link: named. Russia discredits targets through operations straddling cyber and information influence, leaking illegally obtained information.", "sv": "Cyberkoppling: nämnd. Ryssland misskrediterar måltavlor genom att läcka olagligt anskaffade uppgifter i operationer i gränslandet mellan cyber- och informationspåverkan."}}, {"id": "maahan", "s": "3.1.3", "pg": 41, "p": 0, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 1, "sisainen": 3, "talous": 1, "vaesto": 2, "henkinen": 1}, "fp": 44, "d": {"fi": "Suomeen tulee lyhyessä ajassa paljon ihmisiä hakemaan suojelua, tai vieras valtio ohjaa siirtolaisia esimerkiksi itärajalle painostaakseen Suomea. Vastaanoton järjestäminen vaikeutuu, sosiaali- ja terveyspalvelut ruuhkautuvat ja turvallisuusviranomaisten voimavarat sitoutuvat, ja hallitsemattomalta näyttävä tilanne heikentää luottamusta viranomaisiin ja syventää vastakkainasettelua.", "en": "Large numbers of people arrive in Finland within a short time seeking protection, or a foreign state steers migrants, for example to the eastern border, to put pressure on Finland. Organising reception becomes difficult, social and health services are overwhelmed and the resources of the security authorities are tied up, while a situation that looks out of control erodes trust in the authorities and deepens divisions.", "sv": "Ett stort antal människor kommer till Finland på kort tid för att söka skydd, eller så styr en främmande stat migranter mot exempelvis östgränsen för att sätta press på Finland. Det blir svårt att ordna mottagandet, social- och hälsovårdstjänsterna överbelastas och säkerhetsmyndigheternas resurser binds upp, och en situation som verkar okontrollerad försvagar förtroendet för myndigheterna och fördjupar motsättningarna."}, "h72": null, "vj": null, "icon": "\u003cpath d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003cpath d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/>\u003cpath d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>", "sh": [], "o": 4, "i": 3, "to": ["info", "polit", "vakiv", "liikenne"], "fr": ["info", "sota", "ruoka"], "l": {"fi": "Välineellis­tetty maahantulo", "en": "Instrumental­ized migration", "sv": "Instrumentali­serad migration"}, "n": {"fi": "Laajamittainen tai välineellistetty maahantulo", "en": "Large-scale or instrumentalized migration", "sv": "Storskalig eller instrumentaliserad migration"}, "all": null, "ky": {"fi": "Kyberliitos: ei. Luvussa ei mainita kyberiä eikä riippuvuutta tietojärjestelmistä; painopiste rajoilla ja vastaanotossa.", "en": "Cyber link: none. The chapter does not mention cyber or dependence on information systems; the focus is on borders and reception.", "sv": "Cyberkoppling: ingen. I kapitlet nämns varken cyber eller beroende av informationssystem; tyngdpunkten ligger på gränserna och mottagandet."}}, {"id": "vakiv", "s": "3.1.4", "pg": 44, "p": 2, "imp": {"johtaminen": 2, "eu": 1, "puolustus": 1, "sisainen": 2, "talous": 1, "vaesto": 1, "henkinen": 2}, "fp": 47, "d": {"fi": "Joku hyökkää suunnitelmallisesti teräaseella tai ampuma-aseella esimerkiksi kouluun tai väkijoukkoon, katujengien väkivalta vaarantaa sivullisia, tai mellakat ja levottomuudet leviävät nopeasti sosiaalisen median avulla. Poliisin voimavarat sitoutuvat, liikenne ja arki häiriintyvät, ja turvattomuus sekä epäluottamus yhteiskunnan kykyyn ylläpitää järjestystä kasvavat.", "en": "Someone carries out a planned attack with a knife or a firearm, for example at a school or on a crowd, street gang violence endangers bystanders, or riots and unrest spread rapidly via social media. Police resources are tied up, traffic and everyday life are disrupted, and insecurity and distrust in society's ability to maintain order grow.", "sv": "Någon genomför ett planerat angrepp med kniv eller skjutvapen, till exempel mot en skola eller en folkmassa, gatugängens våld drabbar även utomstående, eller upplopp och oroligheter sprids snabbt via sociala medier. Polisens resurser binds upp, trafiken och vardagen störs, och otryggheten och misstron mot samhällets förmåga att upprätthålla ordningen ökar."}, "h72": null, "vj": null, "icon": "\u003cpath d=\"M7 18v-6a5 5 0 1 1 10 0v6\"/>\u003cpath d=\"M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z\"/>\u003cpath d=\"M21 12h1\"/>\u003cpath d=\"M18.5 4.5 18 5\"/>\u003cpath d=\"M2 12h1\"/>\u003cpath d=\"M12 2v1\"/>\u003cpath d=\"m4.929 4.929.707.707\"/>\u003cpath d=\"M12 12v6\"/>", "sh": [], "o": 3, "i": 6, "to": ["info", "polit", "liikenne"], "fr": ["info", "maahan", "terror", "sahko", "ruoka", "poltto"], "l": {"fi": "Kohdennettu väki­valtainen toiminta", "en": "Targeted violent activity", "sv": "Riktad våldsam verksamhet"}, "n": {"fi": "Kohdennettu väkivaltainen toiminta tai muu yhteiskuntajärjestystä vaarantava toiminta", "en": "Targeted violent activity or other activity endangering public order", "sv": "Riktad våldsam verksamhet eller annan verksamhet som äventyrar samhällsordningen"}, "all": null, "ky": {"fi": "Kyberliitos: ei. Sosiaalinen media mainitaan mobilisoinnin ja väärän tiedon kanavana, ei kyberhäiriönä eikä järjestelmäriippuvuutena.", "en": "Cyber link: none. Social media is mentioned as a channel for mobilization and false information, not as a cyber disruption or system dependency.", "sv": "Cyberkoppling: ingen. Sociala medier nämns som en kanal för mobilisering och felaktig information, inte som en cyberstörning eller ett systemberoende."}}, {"id": "terror", "s": "3.1.5", "pg": 48, "p": 2, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 1, "sisainen": 2, "talous": 1, "vaesto": 1, "henkinen": 2}, "fp": 52, "d": {"fi": "Ääriajattelun innoittama tekijä tai pienryhmä iskee esimerkiksi ajoneuvolla tai teräaseella yleisötapahtumaan, liikenteen solmukohtaan tai vähemmistöryhmää vastaan, tai isku kohdistuu sähkö- tai tietoliikenneverkkoon. Ensihoito, päivystykset ja tehohoito ruuhkautuvat, ihmiset välttelevät iskualuetta ja pelko leviää laajalle väestöön.", "en": "An attacker or small group inspired by extremist ideology strikes a public event, a transport hub or a minority group, for example with a vehicle or a knife, or the attack targets the power grid or telecommunications network. Emergency medical services, emergency departments and intensive care are overwhelmed, people avoid the area of the attack and fear spreads widely across the population.", "sv": "En gärningsperson eller en liten grupp som inspirerats av extremistisk ideologi angriper till exempel ett publikevenemang, en knutpunkt i trafiken eller en minoritetsgrupp med fordon eller kniv, eller så riktas attacken mot elnätet eller telenätet. Den prehospitala akutsjukvården, jourerna och intensivvården överbelastas, människor undviker platsen för attacken och rädslan sprids brett i befolkningen."}, "h72": null, "vj": null, "icon": "\u003ccircle cx=\"11\" cy=\"13\" r=\"9\"/>\u003cpath d=\"M14.35 4.65 16.3 2.7a2.41 2.41 0 0 1 3.4 0l1.6 1.6a2.4 2.4 0 0 1 0 3.4l-1.95 1.95\"/>\u003cpath d=\"m22 2-1.5 1.5\"/>", "sh": [], "o": 9, "i": 2, "to": ["polit", "vakiv", "meri", "sateily", "viesti", "tieto", "sahko", "liikenne", "poltto"], "fr": ["info", "sota"], "l": {"fi": "Terroristinen tai väki­valtainen isku", "en": "Terrorist or violent attack", "sv": "Terrorattack eller våldsamt angrepp"}, "n": {"fi": "Yhteiskunnan rakenteisiin tai suuriin ihmisjoukkoihin kohdistunut terroristinen tai muu väkivaltainen isku", "en": "Terrorist or other violent attack on societal structures or large crowds", "sv": "Terroristattack eller annat våldsamt angrepp mot samhällets strukturer eller stora folkmassor"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Valtiollisilla toimijoilla voi olla kybertoimintaan liittyviä kykyjä vahingoittaa kriittistä infrastruktuuria.", "en": "Cyber link: named. State actors may have cyber capabilities to damage critical infrastructure.", "sv": "Cyberkoppling: nämnd. Statliga aktörer kan ha förmåga att genom cyberverksamhet skada kritisk infrastruktur."}}, {"id": "sota", "s": "3.1.6", "pg": 53, "p": 2, "imp": {"johtaminen": 2, "eu": 2, "puolustus": 2, "sisainen": 3, "talous": 3, "vaesto": 3, "henkinen": 3}, "fp": 55, "d": {"fi": "Vieras valtio käyttää asevoimaa Suomea vastaan joko yllättäen tai pitkän painostuksen jälkeen, ja iskut kohdistuvat valtion johtamisjärjestelmiin, puolustukseen sekä energia-, viestintä- ja liikenneverkkoihin. Häiriöt ketjuuntuvat terveydenhuoltoon, huoltovarmuuteen ja talouteen, ja ihmisiä joudutaan suojaamaan asevaikutuksilta ja evakuoimaan.", "en": "A foreign state uses military force against Finland, either by surprise or after prolonged pressure, with strikes on state command systems, defence and the energy, communications and transport networks. The disruption cascades into healthcare, security of supply and the economy, and people have to be protected from the effects of weapons and evacuated.", "sv": "En främmande stat använder militära maktmedel mot Finland, antingen överraskande eller efter långvariga påtryckningar, och angreppen riktas mot statens ledningssystem, försvaret samt energi-, kommunikations- och transportnäten. Störningarna sprider sig vidare till hälso- och sjukvården, försörjningsberedskapen och ekonomin, och befolkningen måste skyddas mot vapenverkan och evakueras."}, "h72": null, "vj": null, "icon": "\u003cpolyline points=\"14.5 17.5 3 6 3 3 6 3 17.5 14.5\"/>\u003cline x1=\"13\" x2=\"19\" y1=\"19\" y2=\"13\"/>\u003cline x1=\"16\" x2=\"20\" y1=\"16\" y2=\"20\"/>\u003cline x1=\"19\" x2=\"21\" y1=\"21\" y2=\"19\"/>\u003cpolyline points=\"14.5 6.5 18 3 21 3 21 6 17.5 9.5\"/>\u003cline x1=\"5\" x2=\"9\" y1=\"14\" y2=\"18\"/>\u003cline x1=\"7\" x2=\"4\" y1=\"17\" y2=\"20\"/>\u003cline x1=\"3\" x2=\"5\" y1=\"19\" y2=\"21\"/>", "sh": [{"n": "RTSP", "c": 2643, "w": {"fi": "kameroiden videovirta", "en": "camera video streams", "sv": "kamerors videoströmmar"}, "u": {"fi": "https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-141a", "en": "https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-141a", "sv": "https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-141a"}, "r": {"fi": ["CISA ym. 2025", "Venäjän sotilastiedustelu seurasi kuljetuksia avoimilla kameroilla"], "en": ["CISA ym. 2025", "Russian military intelligence tracked shipments via exposed cameras"], "sv": ["CISA ym. 2025", "rysk militär underrättelsetjänst följde transporter via exponerade kameror"]}, "v": {"fi": ["Suomi sijalla 7/8 (1 = eniten)", "Yhteensä 8 maassa 37 406 avointa palvelua, Suomen osuus 7,1 %"], "en": ["Finland ranks 7th of 8 (1st = most)", "37,406 open services in the 8 countries in total, Finland's share 7.1% ": 0, "sisainen": 1, "talous": 2, "vaesto": 1, "henkinen": 1}, "fp": 60, "d": {"fi": "Afrikkalainen sikarutto, lintuinfluenssa tai muu vakava eläintauti leviää kotieläintiloille, jolloin eläimiä hävitetään, niiden siirtoja rajoitetaan ja vienti voi katketa. Ruoantuotanto häiriintyy ja joidenkin elintarvikkeiden saatavuus voi heiketä, sikaruton alueella rajoitetaan metsätaloutta ja maastossa liikkumista, ja pahimmillaan eläinperäinen virus alkaa levitä ihmisten välillä.", "en": "African swine fever, avian influenza or another serious animal disease spreads to livestock farms, leading to culling, movement restrictions and possible halts to exports. Food production is disrupted and some foods may become harder to get, forestry and movement in forests and fields are restricted in the swine fever zone, and at worst a virus of animal origin starts spreading between people.", "sv": "Afrikansk svinpest, fågelinfluensa eller någon annan allvarlig djursjukdom sprids till husdjursgårdar, vilket leder till att djur avlivas, förflyttningar begränsas och exporten kan stoppas. Livsmedelsproduktionen störs och tillgången på vissa livsmedel kan försämras, inom svinpestzonen begränsas skogsbruket och vistelsen i terrängen, och i värsta fall börjar ett virus från djur spridas mellan människor."}, "h72": null, "vj": null, "icon": "\u003ccircle cx=\"11\" cy=\"4\" r=\"2\"/>\u003ccircle cx=\"18\" cy=\"8\" r=\"2\"/>\u003ccircle cx=\"20\" cy=\"16\" r=\"2\"/>\u003cpath d=\"M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z\"/>", "sh": [], "o": 3, "i": 1, "to": ["polit", "pandemia", "ruoka"], "fr": ["amr"], "l": {"fi": "Eläintauti­epidemiat", "en": "Animal disease epidemics", "sv": "Djursjukdoms­epidemier"}, "n": {"fi": "Eläintautiepidemiat", "en": "Animal disease epidemics", "sv": "Djursjukdomsepidemier"}, "all": null, "ky": {"fi": "Kyberliitos: ei. Leviäminen eläinten, tuotteiden ja ihmisten mukana; tietojärjestelmiä tai kyberiä ei mainita.", "en": "Cyber link: none. Spread occurs via animals, products, and people; there is no mention of information systems or cyber.", "sv": "Cyberkoppling: ingen. Spridningen sker via djur, produkter och människor; varken informationssystem eller cyber nämns."}}, {"id": "amr", "s": "3.2.2", "pg": 60, "p": 2, "imp": {"johtaminen": 1, "eu": 2, "puolustus": 1, "sisainen": 1, "talous": 2, "vaesto": 2, "henkinen": 1}, "fp": 63, "d": {"fi": "Bakteerit ja muut taudinaiheuttajat muuttuvat vastustuskykyisiksi lääkkeille, jolloin ennen helposti hoidetuista infektioista tulee vaikeahoitoisia tai hengenvaarallisia. Vastustuskykyiset mikrobit leviävät etenkin sairaaloissa ja muissa hoitopaikoissa ja vaikeuttavat leikkauksia, elinsiirtoja ja tehohoitoa, ja kun eläinten tautien hoito tehoaa huonommin, ruoan hinta voi nousta.", "en": "Bacteria and other pathogens become resistant to medicines, so infections that used to be easy to treat become difficult to treat or life-threatening. Resistant microbes spread especially in hospitals and other care settings and complicate surgery, organ transplants and intensive care, and as treatments for animal diseases lose effect, food prices may rise.", "sv": "Bakterier och andra sjukdomsalstrare blir motståndskraftiga mot läkemedel, så att infektioner som tidigare var lätta att behandla blir svårbehandlade eller livshotande. Resistenta mikrober sprids särskilt på sjukhus och andra vårdinrättningar och försvårar operationer, organtransplantationer och intensivvård, och när behandlingen av djursjukdomar fungerar sämre kan livsmedelspriserna stiga."}, "h72": null, "vj": {"fi": "Lupa- ja valvontavirasto; lääkeala Fimea", "en": "Finnish Supervisory Agency; pharmaceuticals Fimea", "sv": "Tillstånds- och tillsynsverket; läkemedel Fimea"}, "icon": "\u003cpath d=\"m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z\"/>\u003cpath d=\"m8.5 8.5 7 7\"/>", "sh": [{"n": "DICOM", "c": 61, "w": {"fi": "lääketieteellisen kuvantamisen arkisto", "en": "medical imaging archive", "sv": "arkiv för medicinsk bilddiagnostik"}, "u": {"fi": "https://i.blackhat.com/EU-23/Presentations/EU-23-Yazdanmehr-Millions_of_Patient_Records_at_Risk.pdf", "en": "https://i.blackhat.com/EU-23/Presentations/EU-23-Yazdanmehr-Millions_of_Patient_Records_at_Risk.pdf", "sv": "https://i.blackhat.com/EU-23/Presentations/EU-23-Yazdanmehr-Millions_of_Patient_Records_at_Risk.pdf"}, "r": {"fi": ["Aplite, Black Hat Europe 2023", "potilastiedot auki tuhansilla DICOM-palvelimilla (PDF)"], "en": ["Aplite, Black Hat Europe 2023", "patient records open on thousands of DICOM servers (PDF)"], "sv": ["Aplite, Black Hat Europe 2023", "patientuppgifter öppna på tusentals DICOM-servrar (PDF)"]}, "v": {"fi": ["Suomi sijalla 1/8 (1 = eniten)", "Yhteensä 8 maassa 209 avointa palvelua, Suomen osuus 29 %"], "en": ["Finland ranks 1st of 8 (1st = most)", "209 open services in the 8 countries in total, Finland's share 29%"], "sv": ["Finland på plats 1/8 (1 = flest)", "Totalt 209 öppna tjänster i 8 länder, Finlands andel 29 %"]}, "a": {"fi": ["Varmista, ettei PACS-/DICOM-palvelin ole suoraan internetissä", "Käytä etäkäyttöön VPN:ää ja salaa PACS-liikenne"], "en": ["Make sure PACS/DICOM servers are not directly reachable from the internet", "Use a VPN for remote access and encrypt PACS traffic"], "sv": ["Säkerställ att PACS-/DICOM-servern inte är direkt nåbar från internet", "Använd VPN för fjärråtkomst och kryptera PACS-trafiken"]}, "t": {"fi": ["+2 (+3,4 %) ajalla 11.11. klo 7.00–19.16 (12 h)"], "en": ["+2 (+3.4%) over 11 Nov, 07:00–19:16 (12 h)"], "sv": ["+2 (+3,4 %) under 11.11. kl. 7.00–19.16 (12 h)"], "s": "\u003csvg class=\"spark\" viewBox=\"0 0 120 26\" width=\"120\" height=\"26\" aria-hidden=\"true\">\u003cpolyline points=\"2.0,13.0 60.0,24.0 118.0,2.0\"/>\u003c/svg>"}}], "o": 2, "i": 3, "to": ["elain", "ruoka"], "fr": ["sota", "tieto", "ketjut"], "l": {"fi": "Mikrobi­lääke­resistenssi", "en": "Anti­microbial resistance", "sv": "Antimikrobiell resistens"}, "n": {"fi": "Mikrobilääkeresistenssi", "en": "Antimicrobial resistance", "sv": "Antimikrobiell resistens"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Kyberhyökkäykset ja terveystietojen väärinkäyttö voivat vaarantaa resistenssin torjunnan ja potilasturvallisuuden.", "en": "Cyber link: named. Cyberattacks and misuse of health data can jeopardize the fight against antimicrobial resistance and patient safety.", "sv": "Cyberkoppling: nämnd. Cyberattacker och missbruk av hälsouppgifter kan äventyra bekämpningen av resistens och patientsäkerheten."}}, {"id": "pandemia", "s": "3.2.3", "pg": 64, "p": 3, "imp": {"johtaminen": 2, "eu": 2, "puolustus": 1, "sisainen": 2, "talous": 3, "vaesto": 3, "henkinen": 3}, "fp": 67, "d": {"fi": "Uusi virus, kuten influenssa- tai koronavirus, leviää nopeasti ympäri maailmaa, eikä rokotetta ole aluksi saatavilla. Moni sairastuu yhtä aikaa, sairaalat ja tehohoito kuormittuvat, ja poissaolot sekä rajoitukset haittaavat terveydenhuoltoa, ruokahuoltoa, energiahuoltoa, kuljetuksia ja muita yhteiskunnan perustoimintoja.", "en": "A new virus, such as an influenza or coronavirus, spreads rapidly around the world, and no vaccine is available at first. Many people fall ill at once, hospitals and intensive care come under heavy strain, and absences and restrictions disrupt health care, food supply, energy supply, transport and other basic functions of society.", "sv": "Ett nytt virus, till exempel ett influensa- eller coronavirus, sprids snabbt över hela världen, och till en början finns det inget vaccin. Många insjuknar samtidigt, sjukhusen och intensivvården blir hårt belastade, och frånvaro och begränsningar stör hälso- och sjukvården, livsmedelsförsörjningen, energiförsörjningen, transporterna och andra grundläggande funktioner i samhället."}, "h72": {"fi": "https://72tuntia.fi/tartuntataudit/", "en": "https://72tuntia.fi/en/infectious-diseases/", "sv": "https://72tuntia.fi/sv/smittsamma-sjukdomar/", "t": {"fi": "Tartuntataudit", "en": "Infectious diseases", "sv": "Smittsamma sjukdomar"}}, "vj": {"fi": "Lupa- ja valvontavirasto; lääkeala Fimea", "en": "Finnish Supervisory Agency; pharmaceuticals Fimea", "sv": "Tillstånds- och tillsynsverket; läkemedel Fimea"}, "icon": "\u003ccircle cx=\"12\" cy=\"11.9\" r=\"2\"/>\u003cpath d=\"M6.7 3.4c-.9 2.5 0 5.2 2.2 6.7C6.5 9 3.7 9.6 2 11.6\"/>\u003cpath d=\"m8.9 10.1 1.4.8\"/>\u003cpath d=\"M17.3 3.4c.9 2.5 0 5.2-2.2 6.7 2.4-1.2 5.2-.6 6.9 1.5\"/>\u003cpath d=\"m15.1 10.1-1.4.8\"/>\u003cpath d=\"M16.7 20.8c-2.6-.4-4.6-2.6-4.7-5.3-.2 2.6-2.1 4.8-4.7 5.2\"/>\u003cpath d=\"M12 13.9v1.6\"/>\u003cpath d=\"M13.5 5.4c-1-.2-2-.2-3 0\"/>\u003cpath d=\"M17 16.4c.7-.7 1.2-1.6 1.5-2.5\"/>\u003cpath d=\"M5.5 13.9c.3.9.8 1.8 1.5 2.5\"/>", "sh": [], "o": 6, "i": 6, "to": ["sahko", "liikenne", "ruoka", "ketjut", "tyo", "jtalous"], "fr": ["info", "elain", "vesi", "ruoka", "ketjut", "tyo"], "l": {"fi": "Pandemia tai laaja epidemia", "en": "Pandemic or major epidemic", "sv": "Pandemi eller omfattande epidemi"}, "n": {"fi": "Pandemia tai laajalle levinnyt epidemia", "en": "Pandemic or widespread epidemic", "sv": "Pandemi eller omfattande epidemi"}, "all": null, "ky": {"fi": "Kyberliitos: ei. Riippuvuudet koskevat lääkkeitä, rokotteita ja henkilöstöä; tietojärjestelmiä tai kyberiä ei mainita.", "en": "Cyber link: none. Dependencies concern medicines, vaccines, and personnel; there is no mention of information systems or cyber.", "sv": "Cyberkoppling: ingen. Beroendena gäller läkemedel, vacciner och personal; varken informationssystem eller cyber nämns."}}, {"id": "meri", "s": "3.2.4", "pg": 67, "p": 3, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 1, "sisainen": 1, "talous": 2, "vaesto": 1, "henkinen": 2}, "fp": 70, "d": {"fi": "Pahimmillaan suuri matkustaja-alus törmää öljyä tai kemikaaleja kuljettavaan alukseen, ja tuhansia ihmisiä on pelastettava mereltä. Meripelastus ja sairaalat kuormittuvat, öljy tai kemikaalit saastuttavat meren ja rannat, ja onnettomuusalueen väylät ja satamat ovat poissa käytöstä, joten laivaliikenne ohjataan muualle.", "en": "In the worst case, a large passenger ship collides with a vessel carrying oil or chemicals, and thousands of people must be rescued at sea. Maritime rescue services and hospitals are stretched, oil or chemicals pollute the sea and shores, and fairways and ports in the area are out of use, so shipping has to be diverted elsewhere.", "sv": "I värsta fall kolliderar ett stort passagerarfartyg med ett fartyg som transporterar olja eller kemikalier, och tusentals människor måste räddas till sjöss. Sjöräddningen och sjukhusen blir hårt belastade, olja eller kemikalier förorenar havet och stränderna, och farleder och hamnar i olycksområdet kan inte användas, så sjöfarten måste ledas om till andra hamnar."}, "h72": null, "vj": null, "icon": "\u003cpath d=\"M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1\"/>\u003cpath d=\"M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76\"/>\u003cpath d=\"M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 2v3\"/>", "sh": [], "o": 3, "i": 4, "to": ["liikenne", "poltto", "jtalous"], "fr": ["terror", "sota", "avaruus", "viesti"], "l": {"fi": "Merellinen moniala­onnettomuus", "en": "Major maritime accident", "sv": "Sektors­övergripande sjöolycka"}, "n": {"fi": "Merellinen monialaonnettomuus", "en": "Multi-sector maritime accident", "sv": "Sektorsövergripande sjöolycka"}, "all": null, "ky": {"fi": "Kyberliitos: epäsuora. GNSS-paikannuksen häirintä ja AIS-tietojen väärentäminen Suomenlahdella lisäävät alusonnettomuuden riskiä; kyberiä ei nimetä.", "en": "Cyber link: indirect. GNSS interference and AIS spoofing in the Gulf of Finland increase the risk of ship accidents; cyber is not named.", "sv": "Cyberkoppling: indirekt. Störning av GNSS-positioneringen och förfalskning av AIS-uppgifter i Finska viken ökar risken för fartygsolyckor; cyber nämns inte."}}, {"id": "palo", "s": "3.2.5", "pg": 71, "p": 3, "imp": {"johtaminen": 1, "eu": 2, "puolustus": 1, "sisainen": 2, "talous": 1, "vaesto": 2, "henkinen": 1}, "fp": 73, "d": {"fi": "Pitkän kuivan ja kuuman jakson aikana syttyy yhtä aikaa useita maastopaloja, esimerkiksi salamoista tai avotulesta, eivätkä pelastustoimen voimavarat riitä kaikkiin. Ihmisiä joudutaan evakuoimaan, savu haittaa terveyttä, sähkö-, tietoliikenne- ja liikenneyhteydet voivat katketa, ja apu muihin onnettomuuksiin viivästyy.", "en": "During a long, dry and hot spell, many wildfires break out at once, for example from lightning or campfires, and the rescue services cannot cope with them all. People have to be evacuated, smoke harms their health, links for power, telecommunications and transport may be cut, and help for other emergencies is delayed.", "sv": "Under en lång, torr och varm period bryter flera terrängbränder ut samtidigt, till exempel orsakade av blixtnedslag eller öppen eld, och räddningsväsendets resurser räcker inte till för alla. Människor måste evakueras, röken skadar hälsan, avbrott kan uppstå i el, datakommunikation och trafik, och hjälpen vid andra olyckor fördröjs."}, "h72": null, "vj": null, "icon": "\u003cpath d=\"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z\"/>", "sh": [], "o": 4, "i": 1, "to": ["viesti", "vesi", "sahko", "liikenne"], "fr": ["sahko"], "l": {"fi": "Suuret maastopalot", "en": "Major wildfires", "sv": "Stora terrängbränder"}, "n": {"fi": "Useat yhtäaikaiset maastopalot tai suuri maastopalo", "en": "Multiple simultaneous wildfires or a large wildfire", "sv": "Flera samtidiga terrängbränder eller en stor terrängbrand"}, "all": null, "ky": {"fi": "Kyberliitos: epäsuora. Palojen aiheuttamat tietoliikennekatkokset vaikeuttavat pelastustoimintaa ja pahentavat tilannetta; kyberiä ei nimetä.", "en": "Cyber link: indirect. Telecommunications outages caused by fires hamper rescue operations and worsen the situation; cyber is not named.", "sv": "Cyberkoppling: indirekt. Avbrott i datakommunikationen till följd av bränder försvårar räddningsverksamheten och förvärrar situationen; cyber nämns inte."}}, {"id": "sateily", "s": "3.2.6", "pg": 74, "p": 2, "imp": {"johtaminen": 2, "eu": 1, "puolustus": 1, "sisainen": 2, "talous": 2, "vaesto": 3, "henkinen": 3}, "fp": 77, "d": {"fi": "Ydinvoimalaitosonnettomuus Suomessa tai lähialueella, ydinräjähdys tai tahallinen teko, kuten likainen pommi, levittää radioaktiivisia aineita ympäristöön, ja ihmisten on suojauduttava sisätiloihin tai väestönsuojiin. Maatalous, ruoka ja juomavesi on suojattava, ympäristön puhdistus voi kestää vuosia, ja huoli terveydestä kuormittaa sosiaali- ja terveyspalveluja.", "en": "A nuclear power plant accident in Finland or nearby, a nuclear explosion or a deliberate act such as a dirty bomb spreads radioactive substances into the environment, and people must shelter indoors or in civil defence shelters. Farming, food and drinking water must be protected, clean-up can take years, and worry about health strains social and health services.", "sv": "En kärnkraftverksolycka i Finland eller i närområdet, en kärnexplosion eller en avsiktlig handling, till exempel en smutsig bomb, sprider radioaktiva ämnen i miljön, och människor måste skydda sig inomhus eller i skyddsrum. Jordbruket, livsmedlen och dricksvattnet måste skyddas, saneringen av miljön kan ta flera år och oron för hälsan belastar social- och hälsovården."}, "h72": {"fi": "https://72tuntia.fi/suojautuminen/", "en": "https://72tuntia.fi/en/sheltering-indoors/", "sv": "https://72tuntia.fi/sv/ta-skydd-inomhus/", "t": {"fi": "Sisälle suojautuminen", "en": "Sheltering indoors", "sv": "Ta skydd inomhus"}}, "vj": null, "icon": "\u003cpath d=\"M12 12h.01\"/>\u003cpath d=\"M7.5 4.2c-.3-.5-.9-.7-1.3-.4C3.9 5.5 2.3 8.1 2 11c-.1.5.4 1 1 1h5c0-1.5.8-2.8 2-3.4-1.1-1.9-2-3.5-2.5-4.4z\"/>\u003cpath d=\"M21 12c.6 0 1-.4 1-1-.3-2.9-1.8-5.5-4.1-7.1-.4-.3-1.1-.2-1.3.3-.6.9-1.5 2.5-2.6 4.3 1.2.7 2 2 2 3.5h5z\"/>\u003cpath d=\"M7.5 19.8c-.3.5-.1 1.1.4 1.3 2.6 1.2 5.6 1.2 8.2 0 .5-.2.7-.8.4-1.3-.5-.9-1.4-2.5-2.5-4.3-1.2.7-2.8.7-4 0-1.1 1.8-2 3.4-2.5 4.3z\"/>", "sh": [], "o": 4, "i": 4, "to": ["info", "vesi", "liikenne", "ruoka"], "fr": ["terror", "sota", "sahko", "tyo"], "l": {"fi": "Vakava säteily­vaara­tilanne", "en": "Serious radiation hazard", "sv": "Allvarlig strålnings­risksituation"}, "n": {"fi": "Vakava säteilyvaaratilanne", "en": "Serious radiation hazard", "sv": "Allvarlig strålningsrisksituation"}, "all": null, "ky": {"fi": "Kyberliitos: ei. Ulkoiset riippuvuudet koskevat sähköverkkoa ja henkilöstöä; kyberiä tai tietojärjestelmiä ei mainita.", "en": "Cyber link: none. External dependencies concern the power grid and personnel; there is no mention of cyber or information systems.", "sv": "Cyberkoppling: ingen. De externa beroendena gäller elnätet och personalen; varken cyber eller informationssystem nämns."}}, {"id": "avaruus", "s": "3.3.1", "pg": 79, "p": 2, "imp": {"johtaminen": 2, "eu": 1, "puolustus": 2, "sisainen": 2, "talous": 2, "vaesto": 1, "henkinen": 1}, "fp": 81, "d": {"fi": "Satelliittien välittämä paikka- ja aikatieto, satelliittiyhteydet ja satelliittikuvat heikkenevät tai katkeavat esimerkiksi avaruusmyrskyn, avaruusromun tai tahallisen häirinnän vuoksi. Tämä haittaa ilmailua, merenkulkua, logistiikkaa ja maataloutta sekä vaikeuttaa sääennusteita, ympäristön seurantaa ja maanpuolustusta.", "en": "Satellite positioning and timing, satellite communications and satellite imagery degrade or fail, for example because of a space storm, space debris or deliberate interference. This disrupts aviation, shipping, logistics and agriculture and hampers weather forecasting, environmental monitoring and national defence.", "sv": "Satellitbaserad positions- och tidsinformation, satellitkommunikation och satellitbilder försämras eller avbryts, till exempel på grund av en rymdstorm, rymdskrot eller avsiktliga störningar. Det stör luftfarten, sjöfarten, logistiken och jordbruket och försvårar väderprognoser, miljöövervakning och landets försvar."}, "h72": null, "vj": {"fi": "Traficom", "en": "Traficom", "sv": "Traficom"}, "icon": "\u003cpath d=\"M13 7 9 3 5 7l4 4\"/>\u003cpath d=\"m17 11 4 4-4 4-4-4\"/>\u003cpath d=\"m8 12 4 4 6-6-4-4Z\"/>\u003cpath d=\"m16 8 3-3\"/>\u003cpath d=\"M9 21a6 6 0 0 0-6-6\"/>", "sh": [], "o": 5, "i": 6, "to": ["meri", "viesti", "liikenne", "ruoka", "ketjut"], "fr": ["polit", "sota", "viesti", "sahko", "ketjut", "tyo"], "l": {"fi": "Avaruus­palvelujen häiriöt", "en": "Space service disruptions", "sv": "Störningar i rymdtjänster"}, "n": {"fi": "Avaruuspalvelujen häiriöt", "en": "Disruptions to space services", "sv": "Störningar i rymdtjänster"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Avaruuspalveluja voidaan häiritä tahallisesti kyber- tai hybridivaikuttamisella satelliitteihin ja maa-infrastruktuuriin.", "en": "Cyber link: named. Space services can be deliberately disrupted through cyber or hybrid influence targeting satellites and ground infrastructure.", "sv": "Cyberkoppling: nämnd. Rymdtjänster kan störas avsiktligt genom cyber- eller hybridpåverkan mot satelliter och markinfrastruktur."}}, {"id": "viesti", "s": "3.3.2", "pg": 82, "p": 2, "imp": {"johtaminen": 3, "eu": 2, "puolustus": 2, "sisainen": 2, "talous": 2, "vaesto": 2, "henkinen": 2}, "fp": 85, "d": {"fi": "Puhelin- ja internetyhteydet sekä radio- ja tv-lähetykset häiriintyvät tai katkeavat esimerkiksi laitevian, sähkökatkon tai kaapelivaurion vuoksi. Hätäpuhelut, väestön varoittaminen, verkkoasiointi, tunnistautuminen ja maksaminen voivat estyä, ja häiriöt haittaavat viranomaisia, terveydenhuoltoa, kauppaa ja kuljetuksia.", "en": "Phone and internet connections, as well as radio and TV broadcasts, are disrupted or cut, for example by equipment faults, power cuts or cable damage. Emergency calls, public warnings, online services, electronic identification and payments may stop working, and the disruption hampers authorities, health care, trade and transport.", "sv": "Telefon- och internetförbindelser samt radio- och tv-sändningar störs eller avbryts, till exempel på grund av utrustningsfel, elavbrott eller kabelskador. Nödsamtal, varningar till befolkningen, e-tjänster, elektronisk identifiering och betalningar kan sluta fungera, och störningarna försvårar myndigheternas arbete, hälso- och sjukvården, handeln och transporterna."}, "h72": {"fi": "https://72tuntia.fi/viestinta-hairiotilanteissa-ja-oikea-tieto/", "en": "https://72tuntia.fi/en/communication-in-a-disruption-and-reliable-information/", "sv": "https://72tuntia.fi/sv/kommunikation-i-handelse-av-storningar-och-korrekt-information/", "t": {"fi": "Viestintä häiriötilanteissa ja oikea tieto", "en": "Communication in a disruption and reliable information", "sv": "Kommunikation i händelse av störningar och korrekt information"}}, "vj": {"fi": "Traficom (Kyberturvallisuuskeskus)", "en": "Traficom (NCSC-FI)", "sv": "Traficom (Cybersäkerhetscentret)"}, "icon": "\u003cpath d=\"M4.9 16.1C1 12.2 1 5.8 4.9 1.9\"/>\u003cpath d=\"M7.8 4.7a6.14 6.14 0 0 0-.8 7.5\"/>\u003ccircle cx=\"12\" cy=\"9\" r=\"2\"/>\u003cpath d=\"M16.2 4.8c2 2 2.26 5.11.8 7.47\"/>\u003cpath d=\"M19.1 1.9a9.96 9.96 0 0 1 0 14.1\"/>\u003cpath d=\"M9.5 18h5\"/>\u003cpath d=\"m8 22 4-11 4 11\"/>", "sh": [{"n": "Winbox", "c": 1822, "w": {"fi": "MikroTik-reitittimen hallintaportti", "en": "MikroTik router management port", "sv": "hanteringsport för MikroTik-routrar"}, "u": {"fi": "https://eclypsium.com/blog/when-honey-bees-become-murder-hornets/", "en": "https://eclypsium.com/blog/when-honey-bees-become-murder-hornets/", "sv": "https://eclypsium.com/blog/when-honey-bees-become-murder-hornets/"}, "r": {"fi": ["Eclypsium 2021", "avoimet MikroTik-reitittimet Mēris-botnetin alustana"], "en": ["Eclypsium 2021", "exposed MikroTik routers power the Mēris botnet"], "sv": ["Eclypsium 2021", "exponerade MikroT vat poikki laajalla alueella pitkään, tai sähköä säännöstellään kiertävillä katkoilla. Sairaalat, koulut, vesihuolto, liikenne, viestintä ja maksaminen häiriintyvät, ja talvella lämmitys loppuu lähes kaikista rakennuksista.", "en": "Power is cut over a wide area for a long time, or electricity is rationed through rotating outages. Hospitals, schools, water supply, transport, communications and payments are disrupted, and in winter heating stops in almost all buildings.", "sv": "Strömmen är borta inom ett stort område under lång tid, eller så ransoneras elen med roterande strömavbrott. Sjukhus, skolor, vattenförsörjningen, trafiken, kommunikationen och betalningarna störs, och vintertid upphör uppvärmningen i nästan alla byggnader."}, "h72": {"fi": "https://72tuntia.fi/sahkokatko/", "en": "https://72tuntia.fi/en/power-outage/", "sv": "https://72tuntia.fi/sv/stromavbrott/", "t": {"fi": "Sähkökatko", "en": "Power outage", "sv": "Strömavbrott"}}, "vj": {"fi": "Energiavirasto", "en": "Energy Authority", "sv": "Energimyndigheten"}, "icon": "\u003cpath d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/>", "sh": [{"n": "IEC 104", "c": 438, "w": {"fi": "sähköverkon kaukokäytön protokolla", "en": "power grid telecontrol protocol", "sv": "protokoll för fjärrstyrning av elnätet"}, "u": {"fi": "https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/", "en": "https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/", "sv": "https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/"}, "r": {"fi": ["ESET 2022", "Industroyer2-hyökkäys sähköasemiin IEC 104:llä, Ukraina"], "en": ["ESET 2022", "Industroyer2 attack on substations via IEC 104, Ukraine"], "sv": ["ESET 2022", "Industroyer2-attacken mot transformatorstationer via IEC 104, Ukraina"]}, "v": {"fi": ["Suomi sijalla 2/8 (1 = eniten)", "Yhteensä 8 maassa 2 045 nämnd. Genom cyberattacker kan stam- och distributionsnäten, elbörsen och elproduktionen störas."}}, {"id": "liikenne", "s": "3.3.6", "pg": 96, "p": 2, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 2, "sisainen": 1, "talous": 3, "vaesto": 2, "henkinen": 2}, "fp": 99, "d": {"fi": "Laivat, junat, lentokoneet tai rekat eivät kulje normaalisti esimerkiksi turvallisuuskriisin, ankaran jäätalven, lakon tai liikenteenohjauksen vian vuoksi. Toimitukset myöhästyvät ja tehtaat voivat pysähtyä, etenkin jos meriliikenne häiriintyy, ja vaikutukset ulottuvat energia-, ruoka- ja terveydenhuoltoon sekä ihmisten pääsyyn töihin.", "en": "Ships, trains, aircraft or lorries cannot run normally, for example because of a security crisis, severe sea ice, a strike or a failure in traffic control. Deliveries are delayed and factories may stop, especially if shipping is disrupted, and the effects reach energy supply, food supply and health care as well as people's ability to get to work.", "sv": "Fartyg, tåg, flygplan eller lastbilar kan inte gå som vanligt, till exempel på grund av en säkerhetskris, en sträng isvinter, en strejk eller fel i trafikstyrningen. Leveranserna försenas och fabriker kan stanna, särskilt om sjöfarten störs, och konsekvenserna når energiförsörjningen, livsmedelsförsörjningen och hälso- och sjukvården samt människors möjlighet att ta sig till arbetet."}, "h72": null, "vj": {"fi": "Traficom", "en": "Traficom", "sv": "Traficom"}, "icon": "\u003cpath d=\"M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2\"/>\u003cpath d=\"M15 18H9\"/>\u003cpath d=\"M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14\"/>\u003ccircle cx=\"17\" cy=\"18\" r=\"2\"/>\u003ccircle cx=\"7\" cy=\"18\" r=\"2\"/>", "sh": [], "o": 7, "i": 18, "to": ["viesti", "vesi", "sahko", "ruoka", "ketjut", "poltto", "tyo"], "fr": ["polit", "maahan", "vakiv", "terror", "sota", "pandemia", "meri", "palo", "sateily", "avaruus", "viesti", "tieto", "sahko", "ketjut", "poltto", "tyo", "jtalous", "rahoitus"], "l": {"fi": "Liikenne­verkkojen häiriöt", "en": "Transport network disruptions", "sv": "Störningar i trafiknäten"}, "n": {"fi": "Liikenneverkkojen ja -palveluiden häiriöt", "en": "Disruptions to transport networks and services", "sv": "Störningar i trafiknät och trafiktjänster"}, "all": null, "ky": {"fi": "Kyberliitos: epäsuora. Tietoliikenne, tietojärjestelmät sekä aika- ja paikkatieto ovat kuljetusten edellytyksiä; ohjausjärjestelmiin voi kohdistua tahallista toimintaa.", "en": "Cyber link: indirect. Telecommunications, information systems, and timing and positioning data are prerequisites for transport; control systems may be deliberately targeted.", "sv": "Cyberkoppling: indirekt. Datakommunikation, informationssystem samt tids- och positionsinformation är förutsättningar för transporter; styrsystemen kan utsättas för avsiktliga handlingar."}}, {"id": "ruoka", "s": "3.4.1", "pg": 102, "p": 2, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 1, "sisainen": 1, "talous": 2, "vaesto": 2, "henkinen": 2}, "fp": 106, "d": {"fi": "Ruokaketju pellolta tehtaisiin, kuljetuksiin ja kauppoihin häiriintyy esimerkiksi katovuoden, eläintautien, sähkökatkon tai maksujärjestelmien vian vuoksi, eikä kaikille riitä ravitsevaa ruokaa. Kaupoista loppuu tuotteita, ihmiset hamstraavat, ja pahimmillaan seurauksena on nälkää, epäluottamusta viranomaisiin ja levottomuuksia.", "en": "The food chain from farms to factories, transport and shops is disrupted, for example by crop failure, animal diseases, power cuts or payment system failures, and not everyone gets enough nutritious food. Shops run out of products, people hoard, and at worst the result is hunger, distrust of the authorities and unrest.", "sv": "Livsmedelskedjan från gårdar till fabriker, transporter och butiker störs, till exempel av missväxt, djursjukdomar, elavbrott eller fel i betalningssystemen, och alla får inte tillräckligt med näringsrik mat. Varor tar slut i butikerna, människor hamstrar och i värsta fall leder det till hunger, misstro mot myndigheterna och oroligheter."}, "h72": {"fi": "https://72tuntia.fi/kotivara/", "en": "https://72tuntia.fi/en/home-emergency-food-supply/", "sv": "https://72tuntia.fi/sv/reservforrad/", "t": {"fi": "Kotivara", "en": "Home emergency food supply", "sv": "Reservförråd"}}, "vj": {"fi": "Ruokavirasto", "en": "Finnish Food Authority", "sv": "Livsmedelsverket"}, "icon": "\u003cpath d=\"M2 22 16 8\"/>\u003cpath d=\"M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\"/>\u003cpath d=\"M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\"/>\u003cpath d=\"M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\"/>\u003cpath d=\"M20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4Z\"/>\u003cpath d=\"M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\"/>\u003cpath d=\"M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\"/>\u003cpath d=\"M19.47 9.47 21 11l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L13 11l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\"/>", "sh": [{"n": "StoreView", "c": 13, "w": {"fi": "Danfoss StoreView, kaupan kylmälaitteiden valvonta", "en": "Danfoss StoreView, store refrigeration monitoring", "sv": "Danfoss StoreView, övervakning av butikers kylutrustning"}, "u": {"fi": "https://www.traficom.fi/fi/uutiset/kyberiskut-aiheuttivat-vahinkoja-kylmalaitteille-suomessa-varautuminen-rajoitti-seurauksia", "en": "https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/", "sv": "https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/"}, "r": {"fi": ["Traficom 2026", "kyberiskut kauppojen kylmälaitteisiin myös Suomessa"], "en": ["Forescout 2026", "exposed refrigeration controls after attacks on European stores"], "sv": ["Forescout 2026", "exponerade kylsystem efter attacker mot europeiska butiker"]}, "v": {"fi": ["Suomi sijalla 6/8 (1 = eniten)", "Yhteensä 8 maassa 417 avointa palvelua, Suomen osuus 3,1 %"], "en": ["Finland ranks 6th of 8 (1st = most)", "417 open services in the 8 countries in total, Finland's share 3.1%"], "sv": ["Finland på plats 6/8 (1 = flest)", "Totalt 417 öppna tjänster i 8 länder, Finlands andel 3,1 %"]}, "a": {"fi": ["Poista kylmälaitteiden hallintaliittymä suorasta internet-näkyvyydestä", "Päivitä AK-SM 800A versioon 4.3.1 tai uudempaan; korvaa tuettomat järjestelmät"], "en": ["Remove direct public access to refrigeration management interfaces", "Patch AK-SM 800A to 4.3.1 or later; replace unsupported systems"], "sv": ["Ta bort kylutrustningens hanteringsgränssnitt från direkt synlighet på internet", "Uppdatera AK-SM 800A till version 4.3.1 eller senare; ersätt system som saknar support"]}}], "o": 3, "i": 15, "to": ["maahan", "vakiv", "pandemia"], "fr": ["polit", "elain", "amr", "pandemia", "sateily", "avaruus", "viesti", "tieto", "vesi", "sahko", "liikenne", "ketjut", "poltto", "tyo", "rahoitus"], "l": {"fi": "Elintarvike­huollon häiriöt", "en": "Food supply disruptions", "sv": "Störningar i livsmedels­försörjningen"}, "n": {"fi": "Elintarvikehuollon häiriöt ja ruokaturvan heikkeneminen", "en": "Disruptions to food supply and weakened food security", "sv": "Störningar i livsmedelsförsörjningen och försämrad livsmedelstrygghet"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Laajamittainen kyberhyökkäys voi lamauttaa tuotantolaitoksia, kauppoja sekä maksu- ja logistiikkajärjestelmiä.", "en": "Cyber link: named. A large-scale cyberattack can paralyze production plants, stores, and payment and logistics systems.", "sv": "Cyberkoppling: nämnd. En omfattande cyberattack kan lamslå produktionsanläggningar, butiker samt betalnings- och logistiksystem."}}, {"id": "ketjut", "s": "3.4.2", "pg": 106, "p": 2, "imp": {"johtaminen": 1, "eu": 2, "puolustus": 2, "sisainen": 2, "talous": 3, "vaesto": 2, "henkinen": 2}, "fp": 109, "d": {"fi": "Ulkomailta tuotavia tuotteita, materiaaleja ja osia saadaan hitaasti tai ei lainkaan, jolloin toimitukset viivästyvät, tuotanto vaikeutuu ja hinnat nousevat. Häiriö leviää nopeasti alalta toiselle, ja pahimmillaan väestön, talouselämän tai maanpuolustuksen välttämättömimpiä tarpeita ei pystytä täyttämään.", "en": "Imported products, materials and components arrive slowly or not at all, so deliveries are delayed, production becomes harder and prices rise. The disruption spreads quickly from one sector to another, and at worst the most essential needs of the population, the economy or national defence cannot be met.", "sv": "Importerade produkter, material och komponenter kommer fram långsamt eller inte alls, vilket gör att leveranserna försenas, produktionen försvåras och priserna stiger. Störningen sprider sig snabbt från en bransch till en annan, och i värsta fall kan man inte tillgodose de mest nödvändiga behoven för befolkningen, näringslivet eller landets försvar."}, "h72": null, "vj": {"fi": "Tukes, Traficom tai Fimea alasta riippuen", "en": "Tukes, Traficom or Fimea depending on the industry", "sv": "Tukes, Traficom eller Fimea beroende på bransch"}, "icon": "\u003cpath d=\"M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z\"/>\u003cpath d=\"M17 18h1\"/>\u003cpath d=\"M12 18h1\"/>\u003cpath d=\"M7 18h1\"/>", "sh": [], "o": 11, "i": 7, "to": ["amr", "pandemia", "avaruus", "viesti", "tieto", "vesi", "sahko", "liikenne", "ruoka", "tyo", "jtalous"], "fr": ["polit", "sota", "pandemia", "avaruus", "liikenne", "poltto", "tyo"], "l": {"fi": "Arvo- ja tuotanto­ketjujen häiriöt", "en": "Value and production chain disruptions", "sv": "Störningar i värde- och produktions­kedjor"}, "n": {"fi": "Häiriöt globaaleissa arvo- ja tuotantoketjuissa", "en": "Disruptions in global value and production chains", "sv": "Störningar i globala värde- och produktionskedjor"}, "all": null, "ky": {"fi": "Kyberliitos: epäsuora. Häiriö määritellään osin tiedonkulun ja logistiikan toimivuuden heikkenemiseksi; kyberiä ei nimetä.", "en": "Cyber link: indirect. The disruption is partly defined as a decline in the functioning of information flows and logistics; cyber is not named.", "sv": "Cyberkoppling: indirekt. Störningen definieras delvis som att informationsflödet och logistiken fungerar sämre; cyber nämns inte."}}, {"id": "poltto", "s": "3.4.3", "pg": 109, "p": 2, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 2, "sisainen": 2, "talous": 3, "vaesto": 2, "henkinen": 1}, "fp": 112, "d": {"fi": "Polttonesteitä, kaasua tai puupolttoaineita ei saada riittävästi koko maassa tai joillakin alueilla, esimerkiksi kun tuonti meritse katkeaa tai maan ainoan öljynjalostamon toiminta häiriintyy. Liikenne, lämmitys, energiantuotanto, ruoan jakelu, maatalous sekä pelastus- ja terveyspalvelut kärsivät, ja hamstraus ja jonot jakeluasemilla voivat aiheuttaa levottomuutta.", "en": "There are not enough liquid fuels, gas or wood fuels across the country or in some regions, for example when imports by sea are cut off or the operation of the country's only oil refinery is disrupted. Transport, heating, energy production, food distribution, agriculture and rescue and health services suffer, and hoarding and queues at filling stations can lead to unrest.", "sv": "Det finns inte tillräckligt med flytande bränslen, gas eller träbränslen i hela landet eller i vissa regioner, till exempel när importen sjövägen avbryts eller driften vid landets enda oljeraffinaderi störs. Trafiken, uppvärmningen, energiproduktionen, livsmedelsdistributionen, jordbruket samt räddningstjänsten och hälso- och sjukvården drabbas, och hamstring och köer vid bensinstationerna kan leda till oroligheter."}, "h72": null, "vj": {"fi": "Tukes", "en": "Tukes", "sv": "Tukes"}, "icon": "\u003cline x1=\"3\" x2=\"15\" y1=\"22\" y2=\"22\"/>\u003cline x1=\"4\" x2=\"14\" y1=\"9\" y2=\"9\"/>\u003cpath d=\"M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18\"/>\u003cpath d=\"M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5\"/>", "sh": [{"n": "ATG", "c": 18, "w": {"fi": "polttoainesäiliön pinnanmittaus", "en": "fuel tank level gauging", "sv": "nivåmätning i bränsletankar"}, "u": {"fi": "https://www.rapid7.com/blog/post/2015/01/22/the-internet-of-gas-station-tank-gauges/", "en": "https://www.rapid7.com/blog/post/2015/01/22/the-internet-of-gas-station-tank-gauges/", "sv": "https://www.rapid7.com/blog/post/2015/01/22/the-internet-of-gas-station-tank-gauges/"}, "r": {"fi": ["Rapid7 2015", "5 800 suojaamatonta säiliömittaria internetissä"], "en": ["Rapid7 2015", "5,800 unprotected tank gauges on the internet"], "sv": ["Rapid7 2015", "5 800 oskyddade tankmätare på internet"]}, "v": {"fi": ["Suomi sijalla 2/8 (1 = eniten)", "Yhteensä 8 maassa 84 avointa palvelua, Suomen osuus 21 %"], "en": ["Finland ranks 2nd of 8 (1st = most)", "84 open services in the 8 countries in total, Finland's share 21%"], "sv": ["Finland på plats 2/8 (1 = flest)", "Totalt 84 öppna tjänster i 8 länder, Finlands andel 21 %"]}, "a": {"fi": ["Kytke säiliömittari verkkoon vain VPN-yhdyskäytävän kautta", "Jos VPN ei ole mahdollinen, rajaa lähdeosoitteet ja aseta sarjaporttiin salasana"], "en": ["Connect tank gauges only through a VPN gateway", "If a VPN is not possible, filter source addresses and set a serial port password"], "sv": ["Anslut tankmätaren till nätet endast via en VPN-gateway", "Om VPN inte är möjligt, begränsa källadresserna och ställ in ett lösenord för serieporten"]}, "t": {"fi": ["ei muutosta ajalla 11.11. klo 7.00–19.16 (12 h)"], "en": ["no change over 11 Nov, 07:00–19:16 (12 h)"], "sv": ["ingen förändring under 11.11. kl. 7.00–19.16 (12 h)"], "s": "\u003csvg class=\"spark\" viewBox=\"0 0 120 26\" width=\"120\" height=\"26\" aria-hidden=\"true\">\u003cpolyline points=\"2.0,24.0 60.0,24.0 118.0,24.0\"/>\u003c/svg>"}}], "o": 7, "i": 8, "to": ["vakiv", "viesti", "sahko", "liikenne", "ruoka", "ketjut", "tyo"], "fr": ["polit", "terror", "sota", "meri", "viesti", "tieto", "sahko", "liikenne"], "l": {"fi": "Poltto­aineiden saatavuuden suur­häiriö", "en": "Major fuel availability disruption", "sv": "Störning i tillgången på bränslen"}, "n": {"fi": "Polttoaineiden saatavuuden suurhäiriö", "en": "Major disruption to fuel availability", "sv": "Omfattande störning i tillgången på bränslen"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Kybervaikuttaminen ja kyberhyökkäykset voivat estää polttoainelogistiikan, jalostuksen ja jakelun.", "en": "Cyber link: named. Cyber influence and cyberattacks can halt fuel logistics, refining, and distribution.", "sv": "Cyberkoppling: nämnd. Cyberpåverkan och cyberattacker kan förhindra bränslelogistiken, raffineringen och distributionen."}}, {"id": "tyo", "s": "3.4.4", "pg": 113, "p": 2, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 2, "sisainen": 1, "talous": 2, "vaesto": 2, "henkinen": 2}, "fp": 116, "d": {"fi": "Kriittisille aloille, kuten sosiaali- ja terveysalalle, energia-alalle, tietotekniikka-alalle, kuljetusalalle ja maataloudelle, ei saada riittävästi osaavia työntekijöitä, kun ihmisiä siirtyy asepalvelukseen tai muihin kriisitehtäviin, sairastuu tai uupuu. Yhteiskunnan palveluita ja perustoimintoja on vaikea pitää yllä, ja toipuminen kriisistä hidastuu.", "en": "Critical sectors such as social and health care, energy, ICT, transport and agriculture cannot get enough skilled workers when people leave for military service or other crisis duties, fall ill or burn out. Society's services and basic functions become hard to maintain, and recovery from the crisis slows down.", "sv": "Kritiska branscher, till exempel social- och hälsovården, energi- och IKT-branschen, transportbranschen och jordbruket, får inte tillräckligt med kompetent arbetskraft när människor övergår till militärtjänst eller andra krisuppgifter, insjuknar eller blir utmattade. Det blir svårt att upprätthålla samhällets tjänster och grundläggande funktioner, och återhämtningen efter krisen går långsammare."}, "h72": null, "vj": null, "icon": "\u003cpath d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>\u003crect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/>", "sh": [], "o": 9, "i": 7, "to": ["pandemia", "sateily", "avaruus", "tieto", "vesi", "sahko", "liikenne", "ruoka", "ketjut"], "fr": ["sota", "pandemia", "viesti", "sahko", "liikenne", "ketjut", "poltto"], "l": {"fi": "Osaavan työvoiman saatavuus", "en": "Skilled labor availability", "sv": "Tillgången på kompetent arbetskraft"}, "n": {"fi": "Osaavan työvoiman saatavuus häiriötilanteissa", "en": "Availability of skilled labor in disruptions", "sv": "Tillgången på kompetent arbetskraft i störningssituationer"}, "all": null, "ky": {"fi": "Kyberliitos: nimetty. Kyberhyökkäykset vaikeuttavat työntekoa; kyberuhat kasvattavat erityisosaajien kysyntää yli tarjonnan.", "en": "Cyber link: named. Cyberattacks make work harder; cyber threats push demand for specialists beyond supply.", "sv": "Cyberkoppling: nämnd. Cyberattacker försvårar arbetet; cyberhot driver upp efterfrågan på specialister så att den överstiger utbudet."}}, {"id": "jtalous", "s": "3.4.5", "pg": 117, "p": 2, "imp": {"johtaminen": 1, "eu": 2, "puolustus": 1, "sisainen": 1, "talous": 2, "vaesto": 2, "henkinen": 2}, "fp": 119, "d": {"fi": "Taantuman tai muun kriisin vuoksi verotulot vähenevät ja menot kasvavat, ja pahimmillaan valtio menettää kykynsä hankkia rahaa, esimerkiksi lainaa rahoitusmarkkinoilta. Silloin maksuja joudutaan asettamaan tärkeysjärjestykseen ja myöhemmin leikkaamaan menoja ja korottamaan veroja, mikä voi heikentää julkisia palveluita sekä ihmisten toimeentuloa, terveyttä ja hyvinvointia.", "en": "A recession or another crisis cuts tax revenue while spending grows, and at worst the state loses its ability to raise money, for example by borrowing on the financial markets. Payments then have to be prioritised, and later spending must be cut and taxes raised, which can weaken public services as well as people's livelihoods, health and well-being.", "sv": "Till följd av en recession eller någon annan kris minskar skatteintäkterna samtidigt som utgifterna ökar, och i värsta fall förlorar staten förmågan att anskaffa medel, till exempel genom att låna på finansmarknaderna. Då måste betalningarna prioriteras och senare måste utgifterna skäras ned och skatterna höjas, vilket kan försämra de offentliga tjänsterna samt människors utkomst, hälsa och välfärd."}, "h72": null, "vj": null, "icon": "\u003cpolyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"/>\u003cpolyline points=\"16 17 22 17 22 11\"/>", "sh": [], "o": 4, "i": 6, "to": ["vesi", "sahko", "liikenne", "rahoitus"], "fr": ["polit", "sota", "pandemia", "meri", "ketjut", "rahoitus"], "l": {"fi": "Julkisen talouden häiriö", "en": "Public finance disruption", "sv": "Störning i den offentliga ekonomin"}, "n": {"fi": "Julkisen talouden häiriö", "en": "Public finance disruption", "sv": "Störning i den offentliga ekonomin"}, "all": {"fi": "Lähes kaikki riskit heikentävät julkista taloutta (PDF-s. 118)", "en": "Nearly all risks weaken public finances (PDF p. 118)", "sv": "Nästan alla risker försvagar den offentliga ekonomin (PDF s. 118)"}, "ky": {"fi": "Kyberliitos: epäsuora. Varainhankinta voi estyä, jos välttämätön infrastruktuuri tai maksunvälitys ei toimi; kyberiä ei nimetä.", "en": "Cyber link: indirect. Funding may be blocked if essential infrastructure or payment services fail; cyber is not named.", "sv": "Cyberkoppling: indirekt. Finansieringen kan förhindras om nödvändig infrastruktur eller betalningsförmedlingen inte fungerar; cyber nämns inte."}}, {"id": "rahoitus", "s": "3.4.6", "pg": 119, "p": 3, "imp": {"johtaminen": 1, "eu": 1, "puolustus": 1, "sisainen": 1, "talous": 3, "vaesto": 2, "henkinen": 2}, "fp": 122, "d": {"fi": "Pankit ajautuvat vaikeuksiin rahoitusmarkkinoiden kriisissä, tai maksujärjestelmissä ja pankkien tietojärjestelmissä on vakava häiriö, jolloin tilisiirrot, korttimaksut, käteisen saanti ja arvopaperikauppa voivat keskeytyä. Ongelmat leviävät nopeasti muuhun talouteen, ja laajassa häiriössä voi estyä palkkojen, eläkkeiden ja tukien maksaminen sekä välttämättömien tarvikkeiden ostaminen.", "en": "Banks run into difficulties in a financial market crisis, or payment systems and banks' information systems suffer a serious disruption, which can interrupt account transfers, card payments, access to cash and securities trading. The problems spread quickly to the rest of the economy, and a widespread disruption can prevent the payment of wages, pensions and benefits and the purchase of essential goods.", "sv": "Bankerna råkar i svårigheter vid en kris på finansmarknaderna, eller så drabbas betalningssystemen och bankernas informationssystem av en allvarlig störning, vilket kan avbryta kontoöverföringar, kortbetalningar, tillgången till kontanter och värdepappershandeln. Problemen sprider sig snabbt till den övriga ekonomin, och en omfattande störning kan förhindra utbetalningen av löner, pensioner och stöd samt inköp av nödvändighetsvaror."}, "h72": null, "vj": {"fi": "Finanssivalvonta", "en": "Financial Supervisory Authority", "sv": "Finansinspektionen"}, "icon": "\u003crect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"/>\u003cline x1=\"2\" x2=\"22\" y1=\"10\" y2=\"10\"/>", "sh": [], "o": 4, "i": 5, "to": ["sahko", "liikenne", "ruoka", "jtalous"], "fr": ["polit", "viesti", "tieto", "sahko", "jtalous"], "l": {"fi": "Rahoitus­järjestelmän häiriö", "en": "Financial system disruption", "sv": "Störning i finans­systemet"}, "n": {"fi": "Rahoitusjärjestelmän häiriö", "en": "Financial system disruption", "sv": "Störning i finanssystemet"}, "all": {"fi": "Lähes kaikki riskit aiheuttavat shokin rahoitusmarkkinoille (PDF-s. 120)", "en": "Nearly all risks cause a shock to financial markets (PDF p. 120)", "sv": "Nästan alla risker orsakar en chock på finansmarknaderna (PDF s. 120)"}, "ky": {"fi": "Kyberliitos: epäsuora. Pankkien tietojärjestelmien ja tietoliikenteen häiriöt sekä vihamielinen vaikuttaminen uhkaavat; kyberiä ei nimetä suoraan.", "en": "Cyber link: indirect. Threats include disruptions to banks' information systems and telecommunications, as well as hostile influence; cyber is not named directly.", "sv": "Cyberkoppling: indirekt. Hot utgörs av störningar i bankernas informationssystem och datakommunikation samt fientlig påverkan; cyber nämns inte direkt."}}];

function buildFocus(id) {

focusEl.addEventListener("click", function (ev) {

addEventListener("popstate", function () {

let tipChip = null;
function chipTip(c) {
  const sec = function (cls, head, body) { return '<div class="s ' + cls + '"><div class="h">' + esc(head) + "</div>" + body + "</div>"; };
  const rows = function (list) { return list.map(function (v, j) { return '<div class="v li' + (j ? " v2" : "") + '">' + esc(v) + "</div>"; }).join(""); };

function hideChipTip() { if (!tipChip) return; tipChip = null; tip.style.display = "none"; tip.className = ""; }
const chipOf = function (ev) { return ev.target && ev.target.closest ? ev.target.closest(".chip") : null; };
document.addEventListener("mouseover", function (ev) { const a = chipOf(ev); if (a) showChipTip(a); });

let queued = false;

function fsCur() { return document.fullscreenElement || document.webkitFullscreenElement; }
function fsLabel() { const b = $("fs"), on = !!fsCur(); b.title = T(on ? "fsOff" : "fsOn"); b.setAttribute("aria-label", b.title); b.setAttribute("aria-pressed", on ? "true" : "false"); }
(function () {
  const de = document.documentElement, req = de.requestFullscreen || de.webkitRequestFullscreen, exit = document.exitFullscreen || document.webkitExitFullscreen;

setLang(lang);
(function () { const id = hashId(); if (!id) return; if (MOBILE.matches) showFocus(id); else select(id); })();
