  if (hintTarget) { const el = $("r-" + hintTarget); if (el) el.classList.remove("pulse"); } }
function paint() {
  const on = {}; if (selected) on[selected] = 1;
  EDGES.forEach(function (d, i) { const el = $("e" + i), hit = $("h" + i); if (!el) return;
    const touch = !!selected && (d.a === selected || d.b === selected);
    const st = touch ? (d.bi ? "both" : d.a === selected ? "out" : "inn") : "";
    el.setAttribute("class", "edge k-" + d.kind + (d.strong ? " strong" : "") + (st ? " " + st : ""));
    hit.setAttribute("class", "hit" + (touch ? " on" : ""));
    // Virtaus kulkee lähteestä kohteeseen; kaksisuuntaisessa valitusta poispäin
    const fl = $("f" + i), fwd = d.bi ? d.p0 === selected : d.dir === "end";
    fl.setAttribute("class", "flow" + (touch ? " on" + (fwd ? "" : " rev") + (st === "inn" ? " in" : st === "both" ? " bi" : "") : ""));
    const mk = "url(#" + (st === "inn" ? "m2" : st === "both" ? "m3" : st ? "m1" : "m0") + ")";
    el.removeAttribute("marker-start"); el.removeAttribute("marker-end");
    if (d.bi) { el.setAttribute("marker-start", mk); el.setAttribute("marker-end", mk); }
    else el.setAttribute(d.dir === "start" ? "marker-start" : "marker-end", mk);
    if (touch) { on[d.a] = 1; on[d.b] = 1; } });
  if (selected) REL.forEach(function (p) { if (p[0] === selected) on[p[1]] = 1; if (p[1] === selected) on[p[0]] = 1; });
  document.body.classList.toggle("hl", !!selected);
  NODES.forEach(function (n) { const el = $("r-" + n.id); el.classList.toggle("on", !!on[n.id]); el.classList.toggle("sel", n.id === selected); });
}
function select(id) { selected = id; tip.style.display = "none"; if (id) hideHint(); paint(); }
gE.addEventListener("mousemove", function (ev) {
  const t = ev.target.closest ? ev.target.closest(".hit") : null; if (!t) { tip.style.display = "none"; return; }
  const d = EDGES[+t.getAttribute("data-i")];
  tip.innerHTML = d.info[lang].map(function (s) { return /→/.test(s) && s.indexOf(":") < 0 ? "<b>" + esc(s) + "</b>" : "<div>" + esc(s) + "</div>"; }).join("");
  tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 410) + "px"; tip.style.top = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 10) + "px"; });
gE.addEventListener("mouseleave", function () { tip.style.display = "none"; });
$("hint-x").addEventListener("click", function (ev) { ev.stopPropagation(); hideHint(); });
document.querySelectorAll("#lang button").forEach(function (b) { b.addEventListener("click", function (ev) { ev.stopPropagation(); setLang(b.getAttribute("data-l")); }); });
document.body.addEventListener("click", function () { if (selected) select(null); });
let queued = false;
function redraw() { if (queued) return; queued = true; requestAnimationFrame(function () { queued = false; draw(); }); }
if (window.ResizeObserver) new ResizeObserver(redraw).observe(map); else addEventListener("resize", redraw);
addEventListener("load", redraw);
setLang(lang);
</script>
