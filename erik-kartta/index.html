ipt>/* ERIK-harjoituksen Kyberlinna-kartta: salasanaportti, riippuvuusmoottori ja käyttöliittymä (versio 2, kaksi tasoa).
   Moottori (evaluate, needLevel, backupLeft, aggregate) on tarkoituksella pieni ja puhdasta ES5:tä; tools/erik_mirror.py on sen
   rivi riviltä vastaava Python-peili, jolla tarkistetaan tilanteet ilman selainta. Pidä ne samoina.
   Taso 2 (kyvykkyydet) lasketaan evaluate-funktiolla, taso 1 (palvelut) aggregate-funktiolla niiden tilasta. */
(function (global) {
  'use strict';
  var KEY = 'erik26-tila-v2', KEYL = 'erik26-linjat';
  var M = null, S = null, R = null, wrap = null, nodeEl = {}, linkEl = [], foc = null, sel = null, hlOwner = null, cur = 'L1';
  var timer = null, zoom = 100, views = {}, layers = {}, drag = null, dragMoved = false;
  var STATE_TXT = ['Pysähtynyt', 'Heikentynyt', 'Toimii'];
  var VIEW_NAME = { L1: 'kaupunki', SA: 'sähkö', VE: 'vesi', TE: 'terveydenhuolto', PA: 'pankki', RU: 'ruoka', PE: 'tietoliikenne ja IT' };
  var LAYERS = ['SA', 'VE', 'TE', 'PA', 'RU', 'PE', 'bad'];

  function $(id) { return document.getElementById(id); }
  function setHtml(el, h) { if (el._h !== h) { el._h = h; el.innerHTML = h; } }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function nodeOf2(id) { return M.nodes[id] || M.l1[id]; }
  function isL1(id) { return !!M.l1[id]; }

  // ---------- Jaettu tila (sama selain, useampi ikkuna: johdon ja pelaajien seinä) ----------
  function loadState() {
    var s = null;
    try { s = JSON.parse(global.localStorage.getItem(KEY)); } catch (e) { s = null; }
    if (!s || typeof s !== 'object') { s = {}; }
    return { off: s.off || {}, since: s.since || {}, skew: s.skew || 0 };
  }
  function saveState() {
    try { global.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* tila säilyy vain tässä ikkunassa */ }
  }

  // ---------- Moottori: taso 2 ----------
  // since[id]: hetki (ms, harjoitusaikaa), jolloin kyvykkyyden verkkosähkö katkesi; varavirtaa on BACKUP sekuntia.
  function backupLeft(id, since, now) {
    var t = since[id];
    if (t === undefined || t === null) { return M.backup; }
    var left = M.backup - (now - t) / 1000;
    return left > 0 ? left : 0;
  }
  // Tarpeen taso: 0 = kunnossa, 1 = osa vaihtoehtoisista lähteistä pois, 2 = ei yhtään toimivaa lähdettä
  function needLevel(need, st, since, now, id) {
    var a = 0, k;
    for (k = 0; k < need.s.length; k++) { if (st[need.s[k]] > 0) { a++; } }
    if (a === 0 && need.pw && backupLeft(id, since, now) > 0) { return 0; }
    if (a === 0) { return 2; }
    if (a < need.s.length) { return 1; }
    return 0;
  }
  function evaluate(off, since, now) {
    var ids = M.order, st = {}, mains = {}, left = {}, bk = {}, lv = {}, i, j, k, id, nd, v, l, changed, guard = 0, a;
    for (i = 0; i < ids.length; i++) { st[ids[i]] = off[ids[i]] ? 0 : 2; }
    do {
      changed = false;
      guard++;
      for (i = 0; i < ids.length; i++) {
        id = ids[i];
        if (off[id]) { continue; }
        nd = M.nodes[id];
        v = 2;
        for (j = 0; j < nd.needs.length; j++) {
          l = needLevel(nd.needs[j], st, since, now, id);
          if (l === 2) {

          } else if (l === 1 && v > 1) { v = 1; }
        }

      }

    for (i = 0; i < ids.length; i++) {

      nd = M.nodes[id];
      lv[id] = [];
      mains[id] = true;
      for (j = 0; j < nd.needs.length; j++) {
        lv[id].push(needLevel(nd.needs[j], st, since, now, id));
        if (nd.needs[j].pw) {
          a = 0;
          for (k = 0; k < nd.needs[j].s.length; k++) { if (st[nd.needs[j].s[k]] > 0) { a++; } }
          mains[id] = a > 0;
        }

      bk[id] = !mains[id] && !off[id] && left[id] > 0;

    }

    for (i = 0; i < M.l1order.length; i++) { if (M.l1[M.l1order[i]].kind === 'res') { ids.push(M.l1order[i]); } }
    for (i = 0; i < ids.length; i++) {
      id = ids[i];
      nd = M.l1[id];
      v = 2;
      lv = [];
      for (j = 0; j < nd.needs.length; j++) {

        lv.push(l);
