   Moottori (evaluate, needLevel, backupLeft) on tarkoituksella pieni ja puhdasta ES5:tä; tools/erik_mirror.py on sen
   rivi riviltä vastaava Python-peili, jolla tarkistetaan tilanteet ilman selainta. Pidä ne samoina. */
(function (global) {
  'use strict';
  var KEY = 'erik26-tila-v1';
  var M = null, S = null, R = null, svg = null, nodeEl = {}, linkEl = [], foc = null, timer = null, zoom = 100;
  var STATE_TXT = ['Pysähtynyt', 'Heikentynyt', 'Toimii'];

  function $(id) { return document.getElementById(id); }
  function setHtml(el, h) { if (el._h !== h) { el._h = h; el.innerHTML = h; } }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- Jaettu tila (sama selain, useampi ikkuna: johdon ja pelaajien seinä) ----------
  function loadState() {
    var s = null;
    try { s = JSON.parse(global.localStorage.getItem(KEY)); } catch (e) { s = null; }
    if (!s || typeof s !== 'object') { s = {}; }
    return { off: s.off || {}, since: s.since || {}, skew: s.skew || 0 };
  }
  function saveState() {
    try { global.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* tila säilyy vain tässä ikkunassa */ }
  }

  // ---------- Moottori ----------
  // since[id]: hetki (ms, harjoitusaikaa), jolloin kyvykkyyden verkkosähkö katkesi; varavirtaa on BACKUP sekuntia.
  function backupLeft(id, since, now) {
    var t = since[id];
    if (t === undefined || t === null) { return M.backup; }
    var left = M.backup - (now - t) / 1000;
    return left > 0 ? left : 0;
  }
  // Tarpeen taso: 0 = kunnossa, 1 = osa vaihtoehtoisista lähteistä pois, 2 = ei yhtään toimivaa lähdettä
  function needLevel(need, st, since, now, id) {
    var a = 0, k;
    for (k = 0; k < need.s.length; k++) { if (st[need.s[k]] > 0) { a++; } }
    if (a === 0 && need.pw && backupLeft(id, since, now) > 0) { return 0; }
    if (a === 0) { return 2; }
    if (a < need.s.length) { return 1; }
    return 0;
  }
  function evaluate(off, since, now) {
    var ids = M.order, st = {}, mains = {}, left = {}, bk = {}, lv = {}, i, j, k, id, nd, v, l, changed, guard = 0, a;
    for (i = 0; i < ids.length; i++) { st[ids[i]] = off[ids[i]] ? 0 : 2; }
    do {
      changed = false;
      guard++;
      for (i = 0; i < ids.length; i++) {
        id = ids[i];
        if (off[id]) { continue; }
        nd = M.nodes[id];
        v = 2;
        for (j = 0; j < nd.needs.length; j++) {
          l = needLevel(nd.needs[j], st, since, now, id);
          if (l === 2) {
            if (nd.needs[j].v === 'H') { v = 0; } else if (v > 1) { v = 1; }
          } else if (l === 1 && v > 1) { v = 1; }
        }
        if (v < st[id]) { st[id] = v; changed = true; }
      }
    } while (changed && guard < 200);
    for (i = 0; i < ids.length; i++) {
      id = ids[i];
      nd = M.nodes[id];
      lv[id] = [];
      mains[id] = true;
      for (j = 0; j < nd.needs.length; j++) {
        lv[id].push(needLevel(nd.needs[j], st, since, now, id));
        if (nd.needs[j].pw) {
          a = 0;
          for (k = 0; k < nd.needs[j].s.length; k++) { if (st[nd.needs[j].s[k]] > 0) { a++; } }
          mains[id] = a > 0;
        }
      }
      left[id] = backupLeft(id, since, now);
      bk[id] = !mains[id] && !off[id] && left[id] > 0;
    }
    return { st: st, mains: mains, left: left, bk: bk, lv: lv };
  }
  // Hetki: verkkosähkön katkeaminen kirjataan ja palautuminen nollaa kellon (varavirta latautuu)
  function step() {
    var now = Date.now() + S.skew, r = evaluate(S.off, S.since, now), ids = M.order, i, id, nd, j, ch = false, hasPw;
    for (i = 0; i < ids.length; i++) {
      id = ids[i];
      nd = M.nodes[id];
      hasPw = false;
      for (j = 0; j < nd.needs.length; j++) { if (nd.needs[j].pw) { hasPw = true; } }
      if (!hasPw) { continue; }
      if (!r.mains[id]) {
        if (S.since[id] === undefined) { S.since[id] = now; ch = true; }
      } else if (S.since[id] !== undefined) {
        delete S.since[id];
        ch = true;
      }
    }
    if (ch) { saveState(); r = evaluate(S.off, S.since, now); }
    R = r;
    render(r);
  }

  // ---------- Esitys ----------
  function fmt(sec) {
    var s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function render(r) {
    var i, id, n, el, c, ch, k, st, mm, ss, a, cnt = {}, clk = {}, asOk = 0, asAll = 0, rows = [];
    for (i = 0; i < M.order.length; i++) {
      id = M.order[i];
      n = M.nodes[id];
      el = nodeEl[id];
      if (!el) { continue; }
      st = r.st[id];
      c = el.base + ' s' + st + (S.off[id] ? ' off' : '') + (r.bk[id] ? ' bk' : '') + (!r.mains[id] && !r.bk[id] && !S.off[id] ? ' ex' : '');
      if (foc) { c += foc.nodes[id] ? ' rel' : ''; }
      el.g.setAttribute('class', c);
      el.g.setAttribute('aria-pressed', S.off[id] ? 'true' : 'false');
      if (el.clk) { el.clk.textContent = r.bk[id] ? fmt(r.left[id]) : ''; }
      if (el.dots) {
        for (k = 0; k < el.dots.length; k++) { el.dots[k].setAttribute('class', el.dots[k].getAttribute('data-c') + ' l' + (r.lv[id][k] || 0)); }
      }
      a = n.a;
      if (a !== 'AS') {
        if (!cnt[a]) { cnt[a] = [0, 0, 0]; }
        cnt[a][2 - st]++;
        if (r.bk[id] && (clk[a] === undefined || r.left[id] < clk[a])) { clk[a] = r.left[id]; }
      } else {
        asAll++;
        if (st === 2) { asOk++; }
      }
      if (st < 2 || r.bk[id]) { rows.push([st, n.a, id]); }
    }
    for (i = 0; i < linkEl.length; i++) {
      el = linkEl[i];
      st = r.st[el.f];
      c = el.base + (st === 0 ? ' bad' : st === 1 ? ' warn' : '');
      if (foc && foc.links[i]) { c += ' hl'; }
      el.g.setAttribute('class', c);
    }
    for (a in cnt) {
      if (cnt.hasOwnProperty(a) && $('ch-' + a)) {
        $('ch-' + a + '-n').textContent = cnt[a][0] + ' toimii · ' + cnt[a][1] + ' heikentynyt · ' + cnt[a][2] + ' pysähtynyt';
        ch = $('ch-' + a + '-k');
        ch.textContent = clk[a] !== undefined ? 'Varavirta ' + fmt(clk[a]) : '';
        $('ch-' + a).setAttribute('class', 'chip a-' + a + (cnt[a][2] ? ' bad' : cnt[a][1] ? ' warn' : '') + (clk[a] !== undefined ? ' bk' : ''));
      }
    }
    if ($('ch-AS-n')) { $('ch-AS-n').textContent = asOk + '/' + asAll + ' kaupunginosassa kaikki palvelut'; }
    renderList(r, rows);
    renderInfo(r);
  }
  function why(id, r) {
    var n = M.nodes[id], out = [], j, k, need, names, l;
    for (j = 0; j < n.needs.length; j++) {
      need = n.needs[j];
      l = r.lv[id][j];
      if (l === 0) { continue; }
      names = [];
      for (k = 0; k < need.s.length; k++) { if (r.st[need.s[k]] === 0) { names.push(M.nodes[need.s[k]].name); } }
      out.push(need.t + ': ' + names.join(', ') + (l === 2 ? ' pysähtynyt' : ' osin pysähtynyt'));
    }
    if (r.bk[id]) { out.push('Varavirralla, jäljellä ' + fmt(r.left[id])); }
    if (!r.mains[id] && !r.bk[id] && !S.off[id]) { out.push('Varavirta loppui'); }
    return out;
  }
  function renderList(r, rows) {
    var el = $('list'), i, h = '', w, t;
    if (!el) { return; }
    rows.sort(function (x, y) { return x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0); });
    for (i = 0; i < rows.length && i < 60; i++) {
      w = why(rows[i][2], r);
      t = S.off[rows[i][2]] ? 'Kytketty pois' : STATE_TXT[rows[i][0]];
      h += '<li class="a-' + rows[i][1] + ' s' + rows[i][0] + '"><b>' + esc(M.nodes[rows[i][2]].name) + '</b> <span class="t">' + esc(t) + '</span>'
        + (w.length ? '<span class="w">' + esc(w[0]) + '</span>' : '') + '</li>';
    }
    setHtml(el, h || '<li class="none">Kaikki kyvykkyydet toimivat.</li>');
    $('list-n').textContent = rows.length ? '(' + rows.length + ')' : '';
  }
  function renderInfo(r) {
    var el = $('info'), id, n, h, j, k, need, lv, w, rev, o, s;
    if (!el) { return; }
    if (!foc) {
      setHtml(el, '<p class="hint">Klikkaa kyvykkyyttä kytkeäksesi sen pois tai päälle. Vie hiiri kyvykkyyden päälle, niin näet mistä se riippuu ja ketkä siitä riippuvat.</p>');
      return;
    }
    id = foc.id;
    n = M.nodes[id];
    s = r.st[id];
    h = '<h3 class="a-' + n.a + '">' + esc(n.name) + '</h3><p class="stt s' + s + '">' + (S.off[id] ? 'Kytketty pois' : STATE_TXT[s]) + '</p>';
    w = why(id, r);
    for (j = 0; j < w.length; j++) { h += '<p class="why">' + esc(w[j]) + '</p>'; }
    h += '<h4>Tarvitsee</h4><ul>';
    for (j = 0; j < n.needs.length; j++) {
      need = n.needs[j];
      lv = r.lv[id][j];
      o = [];
      for (k = 0; k < need.s.length; k++) { o.push(esc(M.nodes[need.s[k]].name)); }
      h += '<li class="l' + lv + '">' + esc(need.t) + ' <span class="v">' + (need.v === 'H' ? 'kova' : 'pehmeä') + (need.pw ? ', varavirta 15 min' : '') + (need.q ? ' · ' + esc(need.q) : '')
        + '</span><span class="w">' + o.join(' tai ') + '</span></li>';
    }
    if (!n.needs.length) { h += '<li class="l0">Ei riippuvuuksia mallissa.</li>'; }
    h += '</ul><h4>Tarvitsijat</h4><ul>';
    rev = M.rev[id] || [];
    for (j = 0; j < rev.length && j < 14; j++) {
      h += '<li class="l' + (r.st[rev[j]] === 2 ? 0 : 2) + '">' + esc(M.nodes[rev[j]].name) + '</li>';
    }
    if (rev.length > 14) { h += '<li class="l0">… ja ' + (rev.length - 14) + ' muuta</li>'; }
    if (!rev.length) { h += '<li class="l0">Ei kukaan.</li>'; }
    setHtml(el, h + '</ul>');
  }

  // ---------- Kohdistus (hiiri tai näppäimistö) ----------
  function setFocus(id) {
    var i, rel = {}, ln = {};
    if ((foc && foc.id === id) || (!foc && !id)) { return; }
    if (!id) {
      foc = null;
      svg.setAttribute('class', svg.getAttribute('class').replace(/ ?foc\b/, ''));
    } else {
      rel[id] = true;
      for (i = 0; i < linkEl.length; i++) {
        if (linkEl[i].f === id || linkEl[i].t === id) { ln[i] = true; rel[linkEl[i].f] = true; rel[linkEl[i].t] = true; }
