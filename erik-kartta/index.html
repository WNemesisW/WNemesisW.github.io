  function backupLeft(id, since, now) {

    for (k = 0; k < need.s.length; k++) { if (st[need.s[k]] > 0) { a++; } }
    if (a === 0 && need.pw && backupLeft(id, since, now) > 0) { return 0; }
    if (a === 0) { return 2; }
    if (a < need.s.length) { return 1; }
    return 0;
  }
  function evaluate(off, since, now) {
    var ids = M.order, st = {}, mains = {}, left = {}, bk = {}, lv = {}, i, j, k, id, nd, v, l, changed, guard = 0, a;
    for (i = 0; i < ids.length; i++) { st[ids[i]] = off[ids[i]] ? 0 : 2; }
    do {
      changed = false;
      guard++;
      for (i = 0; i < ids.length; i++) {
        id = ids[i];
        if (off[id]) { continue; }

        v = 2;
        for (j = 0; j < nd.needs.length; j++) {

      lv[id] = [];
      mains[id] = true;

    if (stopped > 0 || weak > 0) { return 1; }
    return 0;
  }

  function aggregate(r) {

    for (i = 0; i < M.l1order.length; i++) { if (M.l1[M.l1order[i]].kind !== 'res') { ids.push(M.l1order[i]); } }
    for (i = 0; i < M.l1order.length; i++) { if (M.l1[M.l1order[i]].kind === 'res') { ids.push(M.l1order[i]); } }
    for (i = 0; i < ids.length; i++) {
      id = ids[i];
      nd = M.l1[id];
      v = 2;
      lv = [];

        l = aggLevel(nd.needs[j], r.st);
        lv.push(l);
        if (l === 2) {

        } else if (l === 1 && v > 1) { v = 1; }
      }
      r.st[id] = v;
      r.lv[id] = lv;
      r.mains[id] = true;
      left = null;
      for (k = 0; k < nd.members.length; k++) {
        m = nd.members[k];
        if (r.bk[m] && (left === null || r.left[m] < left)) { left = r.left[m]; }
      }

  // Hetki: verkkosähkön katkeaminen kirjataan ja palautuminen nollaa kellon (varavirta latautuu)

      if (!hasPw) { continue; }
      if (!r.mains[id]) {
        if (S.since[id] === undefined) { S.since[id] = now; ch = true; }
      } else if (S.since[id] !== undefined) {
        delete S.since[id];
        ch = true;
      }

    render(R);
  }

  // ---------- Esitys ----------
  function fmt(sec) {
    var s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function isOff(id) {
    var n = M.l1[id];
    if (n) { return !!(n.main && S.off[n.main]); }
    return !!S.off[id];
  }
  function render(r) {
    var i, j, id, n, els, el, c, ch, k, st, a, cnt = {}, clk = {}, asOk = 0, asAll = 0, rows = [], all = M.order.concat(M.l1order), off;
    for (i = 0; i < all.length; i++) {
      id = all[i];

      if (!els) { continue; }
      n = nodeOf2(id);
      st = r.st[id];
      off = isOff(id);
      for (j = 0; j < els.length; j++) {
        el = els[j];
        c = el.base + ' s' + st + (off ? ' off' : '') + (r.bk[id] ? ' bk' : '') + (hlOwner && M.nodes[id] && M.nodes[id].o === hlOwner && !el.ref ? ' mine' : '');
        if (foc && foc.nodes[id]) { c += ' rel'; }
        if (sel === id) { c += ' rel'; }
        el.g.setAttribute('class', c);
        if (el.clk) { el.clk.textContent = r.bk[id] ? fmt(r.left[id]) : ''; }
        if (el.dots) {
          for (k = 0; k < el.dots.length; k++) { el.dots[k].setAttribute('class', el.dots[k].getAttribute('data-c') + ' l' + (r.lv[id][k] || 0)); }
        }
      }
      if (M.nodes[id]) {
        a = n.a;
        if (!cnt[a]) { cnt[a] = [0, 0, 0]; }
        cnt[a][2 - st]++;

        if (st < 2 || r.bk[id]) { rows.push([st, 1, a, id]); }
      } else if (n.kind === 'res') {

        if (st === 2) { asOk++; }
      } else if (st < 2 || r.bk[id]) {

    }

      if (sel && el.view === cur && (el.f === sel || el.t === sel) && !foc) { c += ' hl'; }
      el.g.setAttribute('class', c);

        $('ch-' + a + '-n').textContent = cnt[a][0] + ' toimii' + (cnt[a][1] ? ' · ' + cnt[a][1] + ' heikentynyt' : '') + (cnt[a][2] ? ' · ' + cnt[a][2] + ' pysähtynyt' : '');
        ch = $('ch-' + a + '-k');
        ch.textContent = clk[a] !== undefined ? 'Varavirta ' + fmt(clk[a]) : '';
        $('ch-' + a).setAttribute('class', 'chip a-' + a + (cnt[a][2] ? ' bad' : cnt[a][1] ? ' warn' : '') + (clk[a] !== undefined ? ' bk' : ''));
      }

    renderList(r, rows);

  }
  // Linjan tila: kaikki lähteet pysähtyneet = katkennut, jokin lähde pysähtynyt tai heikentynyt = heikentynyt
  function linkClass(el, r) {
    var k, stopped = 0, weak = 0;
    for (k = 0; k < el.src.length; k++) {

    }
