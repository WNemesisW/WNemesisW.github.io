  // ---------- Moottori: taso 2 ----------

  function backupLeft(id, since, now) {

    var left = M.backup - (now - t) / 1000;

  function needLevel(need, st, since, now, id) {

    if (a === 0) { return 2; }
    if (a < need.s.length) { return 1; }

  }
  function evaluate(off, since, now) {
    var ids = M.order, st = {}, mains = {}, left = {}, bk = {}, lv = {}, i, j, k, id, nd, v, l, changed, guard = 0, a;
    for (i = 0; i < ids.length; i++) { st[ids[i]] = off[ids[i]] ? 0 : 2; }
    do {

      guard++;
      for (i = 0; i < ids.length; i++) {
        id = ids[i];

        nd = M.nodes[id];
        v = 2;

          mains[id] = a > 0;

  function aggregate(r) {

    for (i = 0; i < ids.length; i++) {

      nd = M.l1[id];
      v = 2;
      lv = [];
      for (j = 0; j < nd.needs.length; j++) {

      r.st[id] = v;
      r.lv[id] = lv;
      r.mains[id] = true;

  // ---------- Esitys ----------

        el = els[j];
        c = el.base + ' s' + st + (off ? ' off' : '') + (r.bk[id] ? ' bk' : '') + (hlOwner && M.nodes[id] && M.nodes[id].o === hlOwner && !el.ref ? ' mine' : '');
        if (foc && foc.nodes[id]) { c += ' rel'; }
        if (sel === id) { c += ' rel'; }

        if (el.clk) { el.clk.textContent = r.bk[id] ? fmt(r.left[id]) : ''; }
        if (el.dots) {
          for (k = 0; k < el.dots.length; k++) { el.dots[k].setAttribute('class', el.dots[k].getAttribute('data-c') + ' l' + (r.lv[id][k] || 0)); }
        }
      }
      if (M.nodes[id]) {

        if (st < 2 || r.bk[id]) { rows.push([st, 1, a, id]); }
      } else if (n.kind === 'res') {

        rows.push([st, 0, n.a, id]);

    for (i = 0; i < linkEl.length; i++) {
