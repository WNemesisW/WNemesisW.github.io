<div class="ih-portrait{% if include.size %} ih-portrait--{{ include.size }}{% endif %}">
  <svg class="ih-portrait__rings" viewBox="0 0 360 360" aria-hidden="true" focusable="false">
    <circle class="ih-ring" cx="180" cy="180" r="178"></circle>
    <circle class="ih-ring" cx="180" cy="180" r="146"></circle>
    <circle class="ih-ring" cx="180" cy="180" r="114" stroke-dasharray="2 6"></circle>
    <path d="M180 2 A178 178 0 0 1 334.1 91" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    <circle cx="334.1" cy="91" r="5" fill="currentColor"></circle>
    <circle cx="53.6" cy="253" r="4" fill="currentColor" fill-opacity="0.7"></circle>
    <circle cx="81.3" cy="123" r="3.5" fill="currentColor" fill-opacity="0.5"></circle>
  </svg>
  <img class="ih-portrait__img" src="{{ site.author.avatar | prepend: '/images/' | relative_url }}" alt="{{ site.author.name }}" width="600" height="600">
</div>
